[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173
  publish = "dist"
  functions = "netlify/functions"

[functions."snapshot"]
schedule = "@hourly"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
